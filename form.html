<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plan a custom Eswatini itinerary with cultural, wildlife, and scenery options.">
    <meta name="author" content="Dalnjebo Mamba">
    <title>Plan Your Trip</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Plan Your Trip</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="temples.html">Destinations</a></li>
                <li><a href="references.html">References</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form id="travel-form" method="get" action="review.html">
            <fieldset>
                <legend>Travel Request</legend>

                <label for="destination-package">Choose a travel package</label>
                <select id="destination-package" name="destination-package" required>
                    <option value="" disabled selected>Select a package...</option>
                </select>

                <label>Preferred travel style:</label>
                <fieldset>
                    <legend>Group size</legend>
                    <label><input type="radio" name="group-size" value="Solo" required> Solo</label>
                    <label><input type="radio" name="group-size" value="Couple"> Couple</label>
                    <label><input type="radio" name="group-size" value="Family"> Family</label>
                    <label><input type="radio" name="group-size" value="Group"> Group</label>
                </fieldset>

                <label for="start-date">Trip start date:</label>
                <input type="date" id="start-date" name="start-date" required>

                <label>Interests:</label>
                <fieldset>
                    <legend>Choose your favorite activities</legend>
                    <label><input type="checkbox" name="interests" value="Wildlife"> Wildlife</label>
                    <label><input type="checkbox" name="interests" value="Culture"> Culture</label>
                    <label><input type="checkbox" name="interests" value="Hiking"> Hiking</label>
                    <label><input type="checkbox" name="interests" value="Photography"> Photography</label>
                </fieldset>

                <label for="special-requests">Special requests</label>
                <textarea id="special-requests" name="special-requests" placeholder="Tell us what you want to see or do."></textarea>

                <label for="user-name">Traveler name:</label>
                <input type="text" id="user-name" name="user-name" required>

                <label for="email">Email address:</label>
                <input type="email" id="email" name="email" required>

                <input type="submit" value="Request Itinerary">
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Explore Eswatini</p>
        <p><a href="references.html">References</a></p>
    </footer>
    <script src="scripts/form.js" defer></script>
</body>
</html>
