<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trip summary and itinerary request confirmation for Explore Eswatini.">
    <meta name="author" content="Dalnjebo Mamba">
    <title>Travel Request Summary</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Travel Request Summary</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="temples.html">Destinations</a></li>
                <li><a href="references.html">References</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="review-details">
            <h2>Your itinerary request</h2>
            <p><strong>Package:</strong> <span id="package-name"></span></p>
            <p><strong>Group size:</strong> <span id="group-size"></span></p>
            <p><strong>Start date:</strong> <span id="start-date"></span></p>
            <p><strong>Interests:</strong> <span id="interests"></span></p>
            <p><strong>Special requests:</strong> <span id="special-requests"></span></p>
            <p><strong>Traveler:</strong> <span id="user-name"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
        </section>
        <section id="review-count">
            <h2>Total itinerary requests submitted</h2>
            <p id="count"></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Explore Eswatini</p>
        <p><a href="references.html">References</a></p>
    </footer>
    <script src="scripts/review.js" defer></script>
</body>
</html>
