<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for submitting your product review. View your review details and track total reviews completed.">
    <meta name="author" content="dalnjebo mamba">
    <title>Review Confirmation</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Review Submitted</h1>
    </header>
    <main>
        <section id="review-details">
            <h2>Your Review Details</h2>
            <p><strong>Product Name:</strong> <span id="product-name"></span></p>
            <p><strong>Overall Rating:</strong> <span id="rating"></span></p>
            <p><strong>Date of Installation:</strong> <span id="install-date"></span></p>
            <p><strong>Useful Features:</strong> <span id="features"></span></p>
            <p><strong>Written Review:</strong> <span id="written-review"></span></p>
            <p><strong>User Name:</strong> <span id="user-name"></span></p>
        </section>
        <section id="review-count">
            <h2>Total Reviews Submitted</h2>
            <p id="count"></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Product Reviews. All rights reserved.</p>
    </footer>
    <script src="scripts/review.js" defer></script>
</body>
</html>
